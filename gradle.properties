org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# Kotlin-Daemon lebt zwischen Builds und wächst sonst bis zum JVM-Standard (1/4 des RAM). Gemessen ~1,7 GB Spitze (ADR 0006).
kotlin.daemon.jvmargs=-Xmx3g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
# Screenshot-Tests vergleichen bei jedem Testlauf mit den Goldens (siehe ADR 0006). Fehlende Goldens schlagen fehl.
roborazzi.test.verify=true
