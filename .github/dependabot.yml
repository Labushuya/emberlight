# Dependabot: wöchentliche Update-PRs für Gradle (Version Catalog) und GitHub Actions.
# Minor- und Patch-Updates werden je Ökosystem gebündelt, Major-Updates kommen einzeln.
# Commit-Präfixe folgen Conventional Commits: "build(deps)" für Gradle, "ci(deps)" für Actions.
version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      gradle-minor-und-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions-minor-und-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: ci
      include: scope
