# CI: Prüft jeden Push auf main und jeden Pull Request auf main. Die Prüfungen laufen in zwei parallelen Jobs:
# „Tests und Lint“ führt ./gradlew check aus (Lint, Tests, Screenshots, Coverage, Isolationsprüfungen),
# „APK bauen“ erzeugt die Debug-APK sowie eine unsignierte Release-APK, damit R8-Probleme schon hier auffallen.
# Der Job „Build, Lint und Tests“ wartet auf beide und ist der Pflicht-Check für main (Branch-Schutz).
# Pull Requests laufen immer, auch bei reinen Doku-Änderungen. Auf dem Push-Pfad sparen reine Doku-Änderungen Actions-Minuten.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - 'scripts/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests und Lint
    runs-on: ubuntu-24.04
    # 60 min, damit der Teiljob im ungünstigen Fall (kalter Gradle-Cache, große Änderung) nicht am Limit scheitert.
    # Die Werkzeuge dürfen im ungünstigen Fall bis 13 min brauchen (zwei Versuche à 6 min, Schritt-Limit 15).
    timeout-minutes: 60
    # Ein früher sporadischer Lint-Absturz soll beim Wiederauftreten mit vollständigem Stacktrace im Log stehen
    # (Wiedervorlage in ADR 0001). Ohne diese Variable zeigt Lint nur die Kurzfassung.
    env:
      LINT_PRINT_STACKTRACE: "true"
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Die letzte Version (17) wird JAVA_HOME und führt Gradle aus. Die 21 liegt daneben für die Robolectric-Tests.
      - name: JDK 21 und 17 einrichten
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            21
            17

      # Validiert den Gradle-Wrapper (validate-wrappers ist standardmäßig aktiv) und cacht Gradle.
      # cache-encryption-key verschlüsselt den Configuration Cache im GitHub-Cache. Ohne Schlüssel speichert setup-gradle
      # ihn nicht (Hinweis „no-encryption-key“ in der Job-Zusammenfassung). Der Schlüssel dient nur dieser Verschlüsselung,
      # nicht dem Signieren der APK. Siehe docs/adr/0006.
      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # Robolectric lädt das android-all-instrumented-Jar des Test-SDK (ca. 228 MB) pro Lauf nach ~/.m2. setup-gradle cacht
      # ~/.m2 nicht, deshalb ein eigener Cache. Der Schlüssel nennt Robolectric-Version und SDK, beide aus dem Projekt.
      - name: Robolectric-Version und SDK bestimmen
        id: robolectric
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^robolectric = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          sdk=$(sed -n 's/.*const val TARGET_SDK = \([0-9]*\).*/\1/p' build-logic/convention/src/main/kotlin/io/github/labushuya/emberlight/buildlogic/EmberlightConfig.kt)
          if [[ -z "$version" || -z "$sdk" ]]; then
            echo "::error title=Robolectric-Cache::Robolectric-Version oder Test-SDK ist nicht lesbar."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sdk=${sdk}" >> "$GITHUB_OUTPUT"

      # actions/cache v6.1.0 (Tag, aufgelöst auf den Commit). Der Cache wird nur bei Erfolg des Jobs gespeichert.
      - name: Robolectric-Systemabbilder cachen
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric/android-all-instrumented
          key: robolectric-${{ steps.robolectric.outputs.version }}-sdk${{ steps.robolectric.outputs.sdk }}-${{ runner.os }}

      # Gegenprobe der Standortentfernung (ADR 0015): Werkzeuge per Composite-Action, die auch release.yml (Test-Job) nutzt.
      # Eigenes Zeitlimit: Die Action wiederholt die Installation einmal (je 6 min). Ohne Limit hat ein langsamer Mirror
      # den ganzen Job-Zeitraum von 45 min verbraucht (PR #57). Scheitert der Schritt, bricht der Job ab, nie still.
      # Nur in diesem Job: Der Job „APK bauen“ führt keine Tests aus und braucht die Werkzeuge nicht.
      - name: Werkzeuge für die Standort-Gegenprobe installieren
        timeout-minutes: 15
        uses: ./.github/actions/install-cross-check-tools

      # Node 24 und Chrome für die Browser-Tests der Gäste-Seite (ADR 0019). Fehlt Chrome, bricht der Test mit CI=true ab.
      - name: Werkzeuge für die Browser-Tests einrichten
        uses: ./.github/actions/browser-test-tools

      # Der frühere Schritt „Toolchains anzeigen“ war nur eine Ausgabe. Fehlt eine JDK, bricht dieser Build selbst ab.
      # testForks=2 passt zu den 4 vCPU des Runners (ADR 0006). Die APK-Tasks laufen im Job „APK bauen“ (kein Verlust:
      # die Aufgabenmenge beider Jobs ergibt zusammen die frühere Aufgabe ./gradlew check koverXmlReport assembleDebug assembleRelease).
      - name: Tests, Lint und Coverage
        run: ./gradlew check koverXmlReport -Pemberlight.testForks=2 -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64 -Dorg.gradle.java.installations.auto-download=false

      # Gradle kürzt Ausnahmen im Log (nur Typ und Ort). Bei Fehlschlag die Meldungen aus den Testberichten in den Log schreiben.
      # Gegenprobe-Ausgabe (ADR 0015): ExifTool-Zeilen vorher und nachher je Format, aus dem Testbericht (Systemausgabe).
      - name: Gegenprobe-Ausgabe (ExifTool vorher und nachher) anzeigen
        if: always()
        shell: bash
        run: |
          find . -path '*/build/test-results/*' -name '*ExternalToolCrossCheckTest.xml' \
            -exec grep -h 'GEGENPROBE' {} + 2>/dev/null | sed -e 's/&lt;/</g' -e 's/&gt;/>/g' -e 's/&quot;/"/g' -e 's/&amp;/\&/g' || true
          exit 0

      - name: Meldungen fehlgeschlagener Tests zeigen
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          find . -path '*/build/test-results/*' -name '*.xml' -exec grep -l '<failure' {} + 2>/dev/null | head -5 |
            while read -r report; do
              echo "::group::Testbericht $report"
              grep -A12 '<failure' "$report" | sed -e 's/&#10;/\n/g' -e 's/&lt;/</g' -e 's/&gt;/>/g' -e 's/&quot;/"/g' | head -80
              echo "::endgroup::"
            done
          exit 0

      # Übersicht in der Job-Zusammenfassung: Zeilenabdeckung aus dem Kover-XML und die Namen abweichender Screenshots.
      # Läuft auch bei Fehlschlag. Der Schritt selbst bricht nicht ab, die Durchsetzung passiert in check.
      - name: Coverage und Screenshots zusammenfassen
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          summary="$GITHUB_STEP_SUMMARY"
          report="build/reports/kover/report.xml"
          echo "## Coverage und Screenshots" >> "$summary"
          echo "" >> "$summary"
          if [ -f "$report" ]; then
            # Der Gesamtwert ist das letzte LINE-Zählerelement im Kover-XML.
            total=$(grep -o '<counter type="LINE"[^>]*>' "$report" | tail -1 || true)
            covered=$(sed -E 's/.*covered="([0-9]+)".*/\1/' <<< "$total")
            missed=$(sed -E 's/.*missed="([0-9]+)".*/\1/' <<< "$total")
            awk -v c="$covered" -v m="$missed" 'BEGIN {
              t = c + m
              printf "Zeilenabdeckung: %.1f %% (%d von %d Zeilen), Untergrenze 70 %%\n\n", (t > 0 ? c * 100 / t : 0), c, t
            }' >> "$summary"
          else
            echo "Kein Kover-Report gefunden, die Tests sind vor dem Report abgebrochen." >> "$summary"
            echo "" >> "$summary"
          fi
          # Roborazzi meldet abweichende oder fehlende Goldens mit dem Pfad unter src/test/screenshots.
          changed=$(find . -path '*/build/test-results/*' -name '*.xml' \
            -exec grep -hoE 'screenshots[\\/][A-Za-z0-9_.-]+\.png' {} + 2>/dev/null \
            | sed -E 's|.*[\\/]||' | sort -u || true)
          if [ -n "$changed" ]; then
            echo "Screenshots mit Abweichung oder fehlendem Golden:" >> "$summary"
            sed 's/^/- /' <<< "$changed" >> "$summary"
          else
            echo "Keine Screenshot-Abweichung gefunden." >> "$summary"
          fi
          # Die Job-Zusammenfassung steht sonst nur in der Oberfläche. Im Log ist sie nachlesbar.
          cat "$summary"

      - name: Reports bei Fehlschlag hochladen
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-bei-fehlschlag
          path: |
            **/build/reports/**
            **/build/test-results/**
          retention-days: 7
          if-no-files-found: ignore

      # Diff-Bilder der Screenshot-Tests (Golden gegen Ist und Vergleich). Nur bei Fehlschlag, nie blockierend.
      - name: Screenshot-Diffs hochladen
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshot-diffs
          path: |
            **/build/outputs/roborazzi/*_compare.png
            **/build/outputs/roborazzi/*_actual.png
          retention-days: 7
          if-no-files-found: ignore

  apk:
    name: APK bauen
    runs-on: ubuntu-24.04
    # Eigenes Limit. Der Job führt keine Tests aus und läuft parallel zu „Tests und Lint“.
    timeout-minutes: 45
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Gleiche Toolchains wie im Test-Job. Gradle läuft mit JDK 17, die 21 bleibt für die Toolchain-Auflösung verfügbar.
      - name: JDK 21 und 17 einrichten
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            21
            17

      # Eigener Gradle-Cache dieses Jobs (kein Austausch mit dem Test-Job innerhalb desselben Laufs).
      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # Debug-APK und unsignierte Release-APK. R8 läuft hier mit, damit Probleme früh auffallen.
      - name: APKs bauen
        run: ./gradlew assembleDebug assembleRelease -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64 -Dorg.gradle.java.installations.auto-download=false

      # Die Artefakt-Uploads sind Komfort, kein Qualitätsnachweis. Der Build ist an dieser Stelle schon entschieden.
      # Scheitert ein Upload (z. B. weil das Speicherkontingent des Accounts erschöpft ist), bleibt der Check grün.
      # Der Fehler wird als Warnung und in der Job-Zusammenfassung sichtbar.
      # Auf Pull Requests gibt es keinen Upload, damit dort kein Kontingent verbraucht wird.
      - name: Debug-APK hochladen
        id: upload-apk
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emberlight-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 3
          if-no-files-found: error

      - name: Upload-Fehler melden
        if: always() && steps.upload-apk.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "::warning title=Artefakt nicht hochgeladen::Debug-APK konnte nicht als Artefakt hochgeladen werden, vermutlich ist das Speicherkontingent des Accounts erschöpft. Der Build selbst ist erfolgreich."
          echo "Debug-APK konnte nicht als Artefakt hochgeladen werden, vermutlich ist das Speicherkontingent des Accounts erschöpft. Der Build selbst ist erfolgreich." >> "$GITHUB_STEP_SUMMARY"

  # Pflicht-Check für main (Branch-Schutz, Name unverändert „Build, Lint und Tests“). Er wartet auf beide Teiljobs
  # und ist nur grün, wenn beide erfolgreich sind. Ein abgebrochener oder fehlgeschlagener Teiljob macht ihn rot.
  gate:
    name: Build, Lint und Tests
    needs: [tests, apk]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Ergebnis der Teiljobs prüfen
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
          APK_RESULT: ${{ needs.apk.result }}
        run: |
          set -uo pipefail
          echo "Tests und Lint: ${TESTS_RESULT}, APK bauen: ${APK_RESULT}"
          if [ "$TESTS_RESULT" != "success" ] || [ "$APK_RESULT" != "success" ]; then
            echo "::error title=Build, Lint und Tests::Mindestens ein Teiljob ist nicht erfolgreich (Tests und Lint: ${TESTS_RESULT}, APK bauen: ${APK_RESULT})."
            exit 1
          fi
