# CI: Prüft jeden Push und jeden Pull Request auf main. Baut, lintet und testet das Projekt
# (./gradlew check) und erzeugt die Debug-APK sowie eine unsignierte Release-APK, damit
# R8-Probleme schon hier auffallen. Reine Doku-Änderungen verbrauchen keine Actions-Minuten.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - 'scripts/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, Lint und Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Ein früher sporadischer Lint-Absturz soll beim Wiederauftreten mit vollständigem Stacktrace im Log stehen
    # (Wiedervorlage in ADR 0001). Ohne diese Variable zeigt Lint nur die Kurzfassung.
    env:
      LINT_PRINT_STACKTRACE: "true"
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Die letzte Version (17) wird JAVA_HOME und führt Gradle aus. Die 21 liegt daneben für die Robolectric-Tests.
      - name: JDK 21 und 17 einrichten
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            21
            17

      # Validiert den Gradle-Wrapper (validate-wrappers ist standardmäßig aktiv) und cacht Gradle.
      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Der frühere Schritt „Toolchains anzeigen“ war nur eine Ausgabe. Fehlt eine JDK, bricht dieser Build selbst ab.
      # testForks=2 passt zu den 4 vCPU des Runners (ADR 0006).
      - name: Build, Lint und Tests
        run: ./gradlew check koverXmlReport assembleDebug assembleRelease -Pemberlight.testForks=2 -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64 -Dorg.gradle.java.installations.auto-download=false

      # Übersicht in der Job-Zusammenfassung: Zeilenabdeckung aus dem Kover-XML und die Namen abweichender Screenshots.
      # Läuft auch bei Fehlschlag. Der Schritt selbst bricht nicht ab, die Durchsetzung passiert in check.
      - name: Coverage und Screenshots zusammenfassen
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          summary="$GITHUB_STEP_SUMMARY"
          report="build/reports/kover/report.xml"
          echo "## Coverage und Screenshots" >> "$summary"
          echo "" >> "$summary"
          if [ -f "$report" ]; then
            # Der Gesamtwert ist das letzte LINE-Zählerelement im Kover-XML.
            total=$(grep -o '<counter type="LINE"[^>]*>' "$report" | tail -1 || true)
            covered=$(sed -E 's/.*covered="([0-9]+)".*/\1/' <<< "$total")
            missed=$(sed -E 's/.*missed="([0-9]+)".*/\1/' <<< "$total")
            awk -v c="$covered" -v m="$missed" 'BEGIN {
              t = c + m
              printf "Zeilenabdeckung: %.1f %% (%d von %d Zeilen), Untergrenze 70 %%\n\n", (t > 0 ? c * 100 / t : 0), c, t
            }' >> "$summary"
          else
            echo "Kein Kover-Report gefunden, die Tests sind vor dem Report abgebrochen." >> "$summary"
            echo "" >> "$summary"
          fi
          # Roborazzi meldet abweichende oder fehlende Goldens mit dem Pfad unter src/test/screenshots.
          changed=$(find . -path '*/build/test-results/*' -name '*.xml' \
            -exec grep -hoE 'screenshots[\\/][A-Za-z0-9_.-]+\.png' {} + 2>/dev/null \
            | sed -E 's|.*[\\/]||' | sort -u || true)
          if [ -n "$changed" ]; then
            echo "Screenshots mit Abweichung oder fehlendem Golden:" >> "$summary"
            sed 's/^/- /' <<< "$changed" >> "$summary"
          else
            echo "Keine Screenshot-Abweichung gefunden." >> "$summary"
          fi
          # Die Job-Zusammenfassung steht sonst nur in der Oberfläche. Im Log ist sie nachlesbar.
          cat "$summary"

      # Die Artefakt-Uploads sind Komfort, kein Qualitätsnachweis. Build, Lint und Tests sind an dieser Stelle
      # schon entschieden. Scheitert ein Upload (z. B. weil das Speicherkontingent des Accounts erschöpft ist),
      # bleibt der Check grün. Der Fehler wird als Warnung und in der Job-Zusammenfassung sichtbar.
      # Auf Pull Requests gibt es keinen Upload, damit dort kein Kontingent verbraucht wird.
      - name: Debug-APK hochladen
        id: upload-apk
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emberlight-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 3
          if-no-files-found: error

      - name: Reports bei Fehlschlag hochladen
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-bei-fehlschlag
          path: |
            **/build/reports/**
            **/build/test-results/**
          retention-days: 7
          if-no-files-found: ignore

      # Diff-Bilder der Screenshot-Tests (Golden gegen Ist und Vergleich). Nur bei Fehlschlag, nie blockierend.
      - name: Screenshot-Diffs hochladen
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshot-diffs
          path: |
            **/build/outputs/roborazzi/*_compare.png
            **/build/outputs/roborazzi/*_actual.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload-Fehler melden
        if: always() && steps.upload-apk.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "::warning title=Artefakt nicht hochgeladen::Debug-APK konnte nicht als Artefakt hochgeladen werden, vermutlich ist das Speicherkontingent des Accounts erschöpft. Der Build selbst ist erfolgreich."
          echo "Debug-APK konnte nicht als Artefakt hochgeladen werden, vermutlich ist das Speicherkontingent des Accounts erschöpft. Der Build selbst ist erfolgreich." >> "$GITHUB_STEP_SUMMARY"
