# Release: Baut die signierte Release-APK und prüft sie. Auslöser sind zwei Fälle:
# (a) Tag v*.*.* auf main: veröffentlicht ein GitHub-Release mit APK und SHA-256-Datei.
# (b) workflow_dispatch mit Version: Probelauf. Baut, signiert und prüft wie (a), legt aber
#     KEIN Release und KEINEN Tag an. Das Artefakt "release-dry-run" dient der Kontrolle.
# Anleitung und Fehlerbilder: docs/RELEASE.md
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version X.Y.Z für den Probelauf, z. B. 0.1.0 (kein Release, kein Tag)'
        required: true
        type: string

permissions:
  contents: read

# Zwei Läufe für denselben Tag dürfen sich nicht überschneiden, ein laufender Release-Lauf wird nicht abgebrochen.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Signierte Release-APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      # Die Version kommt aus dem Tag oder dem Eingabefeld. Der Eingabewert geht nur über env: in die Shell,
      # nie direkt per ${{ }} in run:, sonst wäre Script-Injection möglich.
      - name: Version bestimmen und prüfen
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            version="${REF_NAME#v}"
          else
            version="$INPUT_VERSION"
          fi
          re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$version" =~ $re ]]; then
            echo "::error title=Ungültige Version::Die Version '${version}' ist ungültig. Erwartet wird genau X.Y.Z ohne v-Präfix, z. B. 0.1.0."
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$version"
          if (( major > 214747 )); then
            echo "::error title=Ungültige Version::Die Major-Version ${major} ist zu groß, der versionCode würde den Android-Maximalwert überschreiten."
            exit 1
          fi
          if (( minor > 99 || patch > 99 )); then
            echo "::error title=Ungültige Version::Minor und Patch müssen kleiner als 100 sein (versionCode-Schema X*10000 + Y*100 + Z)."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "version_code=$(( major * 10000 + minor * 100 + patch ))" >> "$GITHUB_OUTPUT"

      # Vor Checkout und Build, damit ein fehlendes Secret sofort auffällt.
      - name: Signierschlüssel-Secrets prüfen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${KEYSTORE_BASE64:-}" ]] || missing+=("KEYSTORE_BASE64")
          [[ -n "${KEYSTORE_PASSWORD:-}" ]] || missing+=("KEYSTORE_PASSWORD")
          [[ -n "${KEY_ALIAS:-}" ]] || missing+=("KEY_ALIAS")
          [[ -n "${KEY_PASSWORD:-}" ]] || missing+=("KEY_PASSWORD")
          if (( ${#missing[@]} > 0 )); then
            names=$(printf '%s, ' "${missing[@]}")
            names=${names%, }
            echo "::error title=Signierung nicht eingerichtet::Folgende Repository-Secrets fehlen: ${names}. Anleitung: docs/RELEASE.md, Abschnitt Signierschlüssel."
            exit 1
          fi

      - name: Quellcode auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Vollständige Historie und alle Branches, damit origin/main für die Prüfung vorliegt.
          fetch-depth: 0
          persist-credentials: false

      - name: Tag auf main und ohne bestehendes Release prüfen
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet origin/main > /dev/null; then
            echo "::error title=main nicht verfügbar::origin/main ist nach dem Checkout nicht vorhanden. Der Release-Lauf wird abgebrochen."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error title=Tag zeigt nicht auf main::Tag zeigt nicht auf einen Commit in main. Releases nur aus main erstellen, siehe docs/RELEASE.md."
            exit 1
          fi
          err="${RUNNER_TEMP}/gh-release-view.err"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2> "$err"; then
            echo "::error title=Release existiert bereits::Zu ${TAG} gibt es bereits ein GitHub-Release. Tags werden nicht überschrieben, bitte eine neue Version verwenden."
            exit 1
          fi
          if ! grep -q 'release not found' "$err"; then
            echo "::error title=Release-Status unklar::Der Status des Releases ${TAG} konnte nicht geprüft werden. Details im Log des gh-Befehls, siehe Fehlerbilder in docs/RELEASE.md."
            exit 1
          fi
          rm -f "$err"

      - name: JDK 21 und 17 einrichten
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            21
            17

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Release-Läufe schreiben keinen Cache, damit ein Lauf nichts in den gemeinsamen Cache legt.
          cache-read-only: true

      # Keystore nur mit Rechten für den aktuellen Benutzer. Die Datei wird am Ende wieder gelöscht.
      - name: Keystore dekodieren
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/emberlight-release.p12"
          test -s "${RUNNER_TEMP}/emberlight-release.p12"

      - name: Release-APK bauen
        env:
          VERSION: ${{ steps.version.outputs.version }}
          EMBERLIGHT_KEYSTORE_FILE: ${{ runner.temp }}/emberlight-release.p12
          EMBERLIGHT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          EMBERLIGHT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          EMBERLIGHT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew check assembleRelease -Pemberlight.version="$VERSION" -Pemberlight.requireReleaseSigning=true \
            -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64 -Dorg.gradle.java.installations.auto-download=false

      # Prüft die fertige APK: Signatur, Paketname, Version, versionCode und Zertifikat gegen die Repository-Variable.
      - name: APK prüfen
        id: verify
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          EXPECTED_CERT: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$apk" ]]; then
            echo "::error title=APK fehlt::Die signierte APK ${apk} wurde nicht erzeugt."
            exit 1
          fi
          bt_version=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)
          bt="$ANDROID_HOME/build-tools/${bt_version}"
          echo "Build-Tools: ${bt_version}"

          signer_out=$("$bt/apksigner" verify --print-certs "$apk")
          signers=$(printf '%s\n' "$signer_out" | grep -c 'certificate SHA-256 digest' || true)
          if [[ "$signers" != "1" ]]; then
            echo "::error title=Signatur unklar::Die APK hat ${signers} Signaturen statt genau einer."
            exit 1
          fi
          cert=$(printf '%s\n' "$signer_out" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')
          if [[ ! "$cert" =~ ^[0-9A-F]{64}$ ]]; then
            echo "::error title=Signatur unklar::Der Zertifikats-Fingerprint konnte nicht gelesen werden."
            exit 1
          fi

          badging=$("$bt/aapt2" dump badging "$apk")
          pkg_line=$(printf '%s\n' "$badging" | grep -m 1 '^package:' || true)
          attr() { printf '%s\n' "$pkg_line" | sed -n "s/.*[[:space:]]$1='\([^']*\)'.*/\1/p"; }
          pkg=$(attr name)
          vname=$(attr versionName)
          vcode=$(attr versionCode)
          if [[ "$pkg" != "io.github.labushuya.emberlight" ]]; then
            echo "::error title=Falsches Paket::Paketname ist '${pkg}', erwartet 'io.github.labushuya.emberlight'."
            exit 1
          fi
          if [[ "$vname" != "$VERSION" ]]; then
            echo "::error title=Falsche Version::versionName ist '${vname}', erwartet '${VERSION}'."
            exit 1
          fi
          if [[ "$vcode" != "$VERSION_CODE" ]]; then
            echo "::error title=Falscher versionCode::versionCode ist '${vcode}', erwartet '${VERSION_CODE}'."
            exit 1
          fi

          expected=$(printf '%s' "$EXPECTED_CERT" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')
          if [[ -z "$expected" ]]; then
            echo "::warning title=RELEASE_CERT_SHA256 fehlt::Die Repository-Variable RELEASE_CERT_SHA256 ist nicht gesetzt. Das Zertifikat wird nicht gegen einen Sollwert geprüft, siehe docs/RELEASE.md."
          elif [[ "$cert" != "$expected" ]]; then
            echo "::error title=Falscher Signaturschlüssel::Die APK ist mit einem anderen Schlüssel signiert als erwartet. Ein solches Update ließe sich nicht über die installierte App installieren."
            exit 1
          fi

          echo "apk_sha256=$(sha256sum "$apk" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=${cert}" >> "$GITHUB_OUTPUT"

      # Format wie sha256sum, damit "sha256sum -c" die Datei direkt prüfen kann.
      - name: Release-Dateien erzeugen
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          apk_name="emberlight-v${VERSION}.apk"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/${apk_name}"
          (cd dist && sha256sum "${apk_name}" > "${apk_name}.sha256" && sha256sum -c "${apk_name}.sha256")

      - name: Release-Notes erzeugen
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APK_SHA256: ${{ steps.verify.outputs.apk_sha256 }}
          CERT_SHA256: ${{ steps.verify.outputs.cert_sha256 }}
        run: |
          set -euo pipefail
          notes="dist/release-notes-v${VERSION}.md"
          {
            printf '## emberlight v%s\n\n' "$VERSION"
            printf '### Installation\n\n'
            printf '1. Die Datei `emberlight-v%s.apk` aus diesem Release herunterladen.\n' "$VERSION"
            printf '2. Auf dem Android-Gerät öffnen. Fragt Android nach, die Installation aus unbekannten Quellen für den verwendeten Browser oder Dateimanager erlauben.\n'
            printf '3. Voraussetzung: Android 8 oder neuer.\n\n'
            printf '### Prüfsummen\n\n'
            printf 'SHA-256: `%s`\n\n' "$APK_SHA256"
            printf 'Signaturzertifikat (SHA-256): `%s`\n\n' "$CERT_SHA256"
            printf 'Vor der Installation lassen sich beide Werte prüfen. Die Datei-Prüfsumme vergleicht `sha256sum -c emberlight-v%s.apk.sha256` (Linux, macOS, Git Bash) oder `certutil -hashfile emberlight-v%s.apk SHA256` (Windows) mit dem Wert oben. Das Zertifikat zeigt `apksigner verify --print-certs emberlight-v%s.apk` aus den Android-Build-Tools.\n' "$VERSION" "$VERSION" "$VERSION"
          } > "$notes"

      # Nur bei Tag: GitHub-Release mit APK und Prüfsumme. --notes-file steht vor den generierten Notes (gh-Quelltext).
      - name: GitHub-Release veröffentlichen
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "emberlight v${VERSION}" \
            --notes-file "dist/release-notes-v${VERSION}.md" \
            --generate-notes \
            "dist/emberlight-v${VERSION}.apk" \
            "dist/emberlight-v${VERSION}.apk.sha256"

      # Nur beim Probelauf: Dateien zur Kontrolle herunterladen. Es entsteht kein Release.
      - name: Probelauf-Artefakte hochladen
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run
          path: dist/
          retention-days: 7
          if-no-files-found: error

      - name: Zusammenfassung schreiben
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          APK_SHA256: ${{ steps.verify.outputs.apk_sha256 }}
          CERT_SHA256: ${{ steps.verify.outputs.cert_sha256 }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            dry="nein"
          else
            dry="ja, kein Release und kein Tag"
          fi
          {
            printf '## emberlight v%s\n\n' "$VERSION"
            printf '| Feld | Wert |\n|---|---|\n'
            printf '| Version | `%s` |\n' "$VERSION"
            printf '| versionCode | `%s` |\n' "$VERSION_CODE"
            printf '| APK-SHA-256 | `%s` |\n' "$APK_SHA256"
            printf '| Zertifikat-SHA-256 | `%s` |\n' "$CERT_SHA256"
            printf '| Probelauf | %s |\n' "$dry"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keystore entfernen
        if: always()
        run: |
          set -euo pipefail
          rm -f "${RUNNER_TEMP}/emberlight-release.p12"
